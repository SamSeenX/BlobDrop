<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#fce7f3" />
    </radialGradient>

    <!-- Outer Soft Pink Halo -->
    <radialGradient id="auraGlow" cx="50%" cy="46%" r="55%">
      <stop offset="25%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fff5f7" stop-opacity="0" />
    </radialGradient>

    <!-- Chibi Anime Base Gradient -->
    <linearGradient id="blobGrad" x1="20%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="blobShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#f472b6" flood-opacity="0.32" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#831843" flood-opacity="0.16" />
    </filter>

    <clipPath id="blobClip">
      <circle cx="256" cy="232" r="156" />
    </clipPath>
  </defs>

  <!-- App Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(244, 114, 182, 0.45)" stroke-width="4" />

  <!-- Outer Soft Anime Glow -->
  <circle cx="256" cy="232" r="215" fill="url(#auraGlow)" />

  <!-- Ambient Cute Anime Candies / Bubbles -->
  <circle cx="104" cy="125" r="14" fill="#7dd3fc" opacity="0.75" />
  <circle cx="415" cy="142" r="18" fill="#fde047" opacity="0.8" />
  <circle cx="92" cy="355" r="16" fill="#86efac" opacity="0.75" />
  <circle cx="425" cy="335" r="13" fill="#c4b5fd" opacity="0.8" />
  <!-- Cute star sparkles -->
  <path d="M400 95 Q400 110 415 110 Q400 110 400 125 Q400 110 385 110 Q400 110 400 95 Z" fill="#fde047" opacity="0.85" />
  <path d="M125 390 Q125 400 135 400 Q125 400 125 410 Q125 400 115 400 Q125 400 125 390 Z" fill="#f472b6" opacity="0.85" />

  <!-- Main Hero Anime Chibi Blob -->
  <g filter="url(#blobShadow)">
    <!-- Base Body -->
    <circle cx="256" cy="232" r="156" fill="url(#blobGrad)" />

    <!-- 2-Tone Cel Shadow Crescent (clipped to sphere) -->
    <g clip-path="url(#blobClip)">
      <circle cx="272" cy="265" r="136" fill="rgba(74, 29, 62, 0.15)" />
      <!-- Bottom Rim Light Bounce -->
      <circle cx="256" cy="250" r="148" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="12" />
    </g>

    <!-- Cel Ink Contour Outline -->
    <circle cx="256" cy="232" r="156" fill="none" stroke="#3b1d38" stroke-width="11" />

    <!-- Chibi Pink Blush Marks -->
    <ellipse cx="172" cy="262" rx="20" ry="12" fill="rgba(251, 113, 133, 0.45)" />
    <ellipse cx="340" cy="262" rx="20" ry="12" fill="rgba(251, 113, 133, 0.45)" />

    <!-- Signature Anime Bubble Gleams -->
    <!-- Primary angled pill highlight -->
    <ellipse cx="205" cy="168" rx="35" ry="18" transform="rotate(-35 205 168)" fill="rgba(255, 255, 255, 0.92)" />
    <!-- Secondary micro-sparkle circle -->
    <circle cx="232" cy="142" r="10" fill="#ffffff" />
  </g>

  <!-- Number 4096 in Fredoka Sticker Style -->
  <text x="256" y="260" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="900" font-size="86" text-anchor="middle" letter-spacing="-1" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" paint-order="stroke fill" fill="#3b1d38">4096</text>

  <!-- Bottom Banner Pill: BLOBDROP -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="410" width="280" height="56" rx="28" fill="#ffffff" stroke="rgba(244, 114, 182, 0.65)" stroke-width="3" />
    <text x="256" y="446" font-family="'Fredoka', 'Outfit', sans-serif" font-weight="900" font-size="24" fill="#db2777" text-anchor="middle" letter-spacing="4">BLOBDROP</text>
  </g>
</svg>
